name: EAS Update

on:
  push:
    branches: [dev, main]
    paths:
      - 'mobile/**'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install packages
        run: npm ci

      - name: Publish update
        env:
          # Set in GitHub: Settings → Secrets and variables → Actions → Variables
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            eas update --channel production --auto --non-interactive
          else
            eas update --channel preview --auto --non-interactive
          fi
